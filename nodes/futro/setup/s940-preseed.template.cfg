#### S940 (f22) automated Debian 13 install — template. Plan: ../s940-stick-plan-v3.md
#### Filled copy lives in ~/s940-build/ on the raspi. The pi password is typed by the owner at install (not preseeded).
#### Placeholders: @KEY_RASPI@, @KEY_FUTRO@. Hostname, locale, keymap come from the boot line.

# Locale, keyboard (also on the boot line: the preseed file loads after these questions)
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network: first interface with a link (the S940 can have a WiFi card in the mPCIe socket)
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# User pi, root login off (pi gets sudo); the installer asks the password for pi (owner 2026-10-30)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string pi
d-i passwd/username string pi

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Bucharest
d-i clock-setup/ntp boolean true

# Disk: s940-pickdisk.sh sets partman-auto/disk to the one internal disk, or blocks (fail closed)
d-i partman/early_command string sh /cdrom/s940-pickdisk.sh
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string \
    s940 :: \
        512 512 512 free \
            $iflabel{ gpt } method{ efi } format{ } . \
        4096 4096 4096 linux-swap \
            method{ swap } format{ } . \
        10000 10000 -1 ext4 \
            method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select s940
d-i partman-efi/non_efi_system boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Packages
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
tasksel tasksel/first multiselect standard, ssh-server
popularity-contest popularity-contest/participate boolean false

# Boot loader (thin-client UEFI can lose its NVRAM entry: also install the removable path)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# SSH keys for pi, login-screen lines (Host, MAC, IP); SSH password login stays on
d-i preseed/late_command string \
    mkdir -p /target/home/pi/.ssh; \
    printf '%s\n' '@KEY_RASPI@' '@KEY_FUTRO@' > /target/home/pi/.ssh/authorized_keys; \
    in-target chown -R pi:pi /home/pi/.ssh; \
    in-target chmod 700 /home/pi/.ssh; \
    in-target chmod 600 /home/pi/.ssh/authorized_keys; \
    mkdir -p /target/etc/issue.d; \
    IF=$(ip route | awk '/^default/ {print $5; exit}'); \
    printf '%s\n' "Host: $(cat /target/etc/hostname)" "MAC:  $(cat /sys/class/net/$IF/address)" 'IP:   \4' '' > /target/etc/issue.d/s940.issue

# End: switch off (the owner pulls the stick, then powers on)
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
